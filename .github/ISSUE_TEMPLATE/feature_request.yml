name: Feature request
description: Propose an improvement to a public Sybatel project
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are most useful when they describe the user or operational problem before proposing a solution.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What problem should this change solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the capability or outcome you would like to see.
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Suggested approach
      description: Optional. Share a possible implementation or workflow if you have one.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Note workarounds or other approaches you considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues and discussions for a similar request.
          required: true
        - label: I have described the problem or user need, not only a proposed implementation.
          required: true
